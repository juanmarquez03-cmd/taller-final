# Publica una imagen por cada versión de la aplicación.
#
# Se ejecuta al crear un tag de Git que empiece por "v" (por ejemplo v1.0.0 o
# v2.0.0, desde la página de GitHub: Releases -> Draft a new release). También se
# puede lanzar a mano desde Actions -> Publicar imagen -> Run workflow.
#
# Resultado: ghcr.io/<usuario-en-minusculas>/info-api:<version>
name: Publicar imagen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (por ejemplo 2.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGEN="ghcr.io/${OWNER}/info-api:${VERSION}"
          docker build --build-arg APP_VERSION="${VERSION}" -t "${IMAGEN}" .
          docker push "${IMAGEN}"
          echo "Imagen publicada: ${IMAGEN}" >> "$GITHUB_STEP_SUMMARY"
